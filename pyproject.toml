[project]
name = "purchase-intent"
version = "1.0.0"
description = "Pipeline de propensão de compra em e-commerce — FIAP Tech Challenge Fase 2"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Grupo 10MLET" }]

# ── Dependências de PRODUÇÃO ─────────────────────────────────
# São as únicas instaladas na imagem Docker (`--only main`).
dependencies = [
    "scikit-learn (>=1.5.0,<2.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "pyarrow (>=16.0.0)",
    "joblib (>=1.4.0,<2.0.0)",
    # mlflow-skinny é o cliente sem servidor/UI: a imagem só precisa
    # carregar o modelo do Registry. O mlflow completo fica no grupo dev,
    # onde o pipeline treina e a UI roda.
    "mlflow-skinny (>=2.16.0,<3.0.0)",
    "pandera (>=0.23.0,<1.0.0)",
    "pydantic (>=2.7.0,<3.0.0)",
    "pydantic-settings (>=2.3.0,<3.0.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
]

# ── Dependências de DESENVOLVIMENTO ──────────────────────────
# Nunca entram na imagem: testes, lint, DVC e ferramentas de EDA.
[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.6"
dvc = {extras = ["s3"], version = "^3.67.1"}
mlflow = "^2.22"
httpx = "^0.27"
matplotlib = "^3.8"
ipykernel = "^6.29"
seaborn = "^0.13"

[tool.poetry]
package-mode = true
packages = [{ include = "src" }]

# ── Lint e formatação ────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Testes e cobertura ───────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["src/pipelines/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
